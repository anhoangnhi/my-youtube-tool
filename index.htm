<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Pro Max V2</title>
    <style>
        :root { 
            --primary: #ff4444; --bg: #050505; --card: rgba(22, 22, 22, 0.9); 
            --text: #eee; --accent: #1db954; --item-hover: #333; 
        }
        body { 
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; min-height: 100vh;
        }
        
        .main-layout { display: flex; gap: 25px; width: 100%; max-width: 1300px; margin: 0 auto; flex-wrap: wrap; }
        
        /* Glassmorphism Effect */
        .container, .right-col { 
            background: var(--card); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .left-col { flex: 2; min-width: 350px; }
        .container { padding: 30px; position: relative; }
        
        .right-col { 
            flex: 1; min-width: 320px; padding: 25px; 
            display: flex; flex-direction: column; max-height: 85vh; 
        }

        h1 { 
            font-size: 22px; margin-bottom: 25px; text-align: center;
            background: linear-gradient(90deg, var(--primary), #ff8888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800; letter-spacing: 1px;
        }

        /* Visualizer giả lập */
        .visualizer {
            display: none; justify-content: center; align-items: flex-end;
            height: 40px; gap: 3px; margin-bottom: 20px;
        }
        .visualizer span {
            width: 4px; background: var(--accent); border-radius: 2px;
            animation: bounce 0.5s ease infinite alternate;
        }
        @keyframes bounce { 
            from { height: 5px; } to { height: 35px; } 
        }

        .input-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input { 
            flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #333; 
            background: rgba(0,0,0,0.3); color: #fff; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,68,68,0.2); }
        
        button#main-run { 
            padding: 0 25px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        button#main-run:hover { transform: scale(1.05); background: #ff5555; }

        #player-wrapper { 
            width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; 
            overflow: hidden; margin-bottom: 25px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .music-mode-active { transform: scale(0.8); opacity: 0; height: 0; margin: 0; }

        .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: rgba(255,255,255,0.03); padding: 18px; border-radius: 16px; }
        .flex-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        
        .btn-action { 
            background: #222; color: white; border: 1px solid #444; 
            padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 11px;
            text-transform: uppercase; transition: 0.2s;
        }
        .btn-action:hover { background: var(--accent); border-color: var(--accent); }

        #playlist-items { overflow-y: auto; flex-grow: 1; list-style: none; padding: 0; margin-top: 10px; }
        #playlist-items li { 
            padding: 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; 
            background: rgba(255,255,255,0.03); display: flex; align-items: center; gap: 12px;
        }
        #playlist-items li:hover { background: rgba(255,255,255,0.08); }
        #playlist-items li.active { background: rgba(29, 185, 84, 0.1); border: 1px solid var(--accent); color: var(--accent); }

        #thumb-img { width: 20%; height:20%; border-radius: 16px; margin-top: 20px; display: none; }
        
        .timer-info { font-size: 12px; color: #888; text-align: right; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="left-col">
        <div class="container">
            <h1>MUSIC PRO MAX V2</h1>
            
            <div class="input-box">
                <input type="text" id="v-url" value="https://www.youtube.com/watch?v=jfKfPfyJRdk" placeholder="Dán link Video/Playlist...">
                <button id="main-run" onclick="loadSource()">CHẠY</button>
            </div>

            <div class="visualizer" id="viz">
                <span style="animation-duration: 0.4s"></span><span style="animation-duration: 0.7s"></span>
                <span style="animation-duration: 0.5s"></span><span style="animation-duration: 0.6s"></span>
                <span style="animation-duration: 0.4s"></span><span style="animation-duration: 0.8s"></span>
            </div>

            <div id="player-wrapper"><div id="player"></div></div>

            <div class="tools">
                <div class="panel">
                    <div class="flex-row">
                        <span>Speed:</span>
                        <select id="v-speed" onchange="setVp()" style="background:#333; color:white; border:none; border-radius:4px;">
                            <option value="1">1.0x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2.0x</option>
                        </select>
                    </div>
                    <div class="flex-row">
                        <button class="btn-action" onclick="player.previousVideo()">◀</button>
                        <button id="pp-btn" class="btn-action" style="flex:1; margin:0 5px;" onclick="togglePlayPause()">PAUSE</button>
                        <button class="btn-action" onclick="player.nextVideo()">▶</button>
                    </div>
                </div>
                <div class="panel">
                    <div class="flex-row">
                        <span>Music Mode:</span>
                        <input type="checkbox" id="m-toggle" onchange="handleMusicMode()">
                    </div>
                    <div class="flex-row">
                        <span>Hẹn giờ (phút):</span>
                        <select id="s-timer" onchange="setTimer()" style="background:#333; color:white; border:none; border-radius:4px;">
                            <option value="0">Tắt</option>
                            <option value="30">30m</option>
                            <option value="60">60m</option>
                            <option value="120">120m</option>
                        </select>
                    </div>
                    <div id="timer-display" class="timer-info"></div>
                </div>
            </div>
            <img id="thumb-img" alt="Thumbnail">
        </div>
    </div>

    <div class="right-col">
        <div style="font-weight:bold; color:var(--primary)">PLAYLIST / HISTORY</div>
        <ul id="playlist-items">
            <li style="color:#666; justify-content:center;">Đang đợi link bài hát...</li>
        </ul>
        <button class="btn-action" style="margin-top:10px; width:100%" onclick="clearHistory()">Xóa lịch sử</button>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    let timerInterval;

    function onYouTubeIframeAPIReady() {
        loadHistory();
        loadSource();
    }

    function loadSource() {
        const url = document.getElementById('v-url').value;
        const videoId = url.match(/(?:youtu\.be\/|youtube\.com.*v=)([a-zA-Z0-9_-]{11})/)?.[1];
        const playlistId = url.match(/[&?]list=([a-zA-Z0-9_-]+)/)?.[1];

        if (!videoId && !playlistId) return;

        if (!player) {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'enablejsapi': 1 },
                events: { 
                    'onStateChange': onPlayerStateChange,
                    'onReady': () => { processLoad(videoId, playlistId); }
                }
            });
        } else {
            processLoad(videoId, playlistId);
        }
        saveToHistory(url);
    }

    function processLoad(vId, pId) {
        if (pId) {
            player.loadPlaylist({ list: pId, listType: 'playlist' });
        } else {
            player.loadVideoById(vId);
        }
        showThumb(vId);
    }

    function onPlayerStateChange(event) {
        const btn = document.getElementById('pp-btn');
        const viz = document.getElementById('viz');
        
        if (event.data === YT.PlayerState.PLAYING) {
            btn.innerText = "PAUSE";
            viz.style.display = 'flex'; // Hiện sóng nhạc
            updatePlaylistSelection();
        } else {
            btn.innerText = "PLAY";
            viz.style.display = 'none'; // Ẩn sóng nhạc
        }

        if (event.data === YT.PlayerState.CUED || event.data === YT.PlayerState.PLAYING) {
            const list = player.getPlaylist();
            if (list) updatePlaylistUI(list);
        }
    }

    // --- TÍNH NĂNG HẸN GIỜ ---
    function setTimer() {
        clearInterval(timerInterval);
        let mins = parseInt(document.getElementById('s-timer').value);
        if (mins <= 0) {
            document.getElementById('timer-display').innerText = "";
            return;
        }
        let endTime = Date.now() + mins * 60000;
        
        timerInterval = setInterval(() => {
            let remain = Math.round((endTime - Date.now()) / 1000);
            if (remain <= 0) {
                player.pauseVideo();
                clearInterval(timerInterval);
                document.getElementById('timer-display').innerText = "Đã hết giờ!";
            } else {
                document.getElementById('timer-display').innerText = `Tự tắt sau: ${Math.floor(remain/60)}p ${remain%60}s`;
            }
        }, 1000);
    }

    // --- TÍNH NĂNG LỊCH SỬ ---
    function saveToHistory(url) {
        let history = JSON.parse(localStorage.getItem('music_history') || "[]");
        if (!history.includes(url)) {
            history.unshift(url);
            if (history.length > 10) history.pop();
            localStorage.setItem('music_history', JSON.stringify(history));
            loadHistory();
        }
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem('music_history') || "[]");
        if (history.length > 0 && !player) {
            document.getElementById('v-url').value = history[0];
        }
    }

    function clearHistory() {
        localStorage.removeItem('music_history');
        location.reload();
    }

    // --- CÁC HÀM CŨ ---
    function updatePlaylistUI(listIds) {
        const container = document.getElementById('playlist-items');
        container.innerHTML = "";
        listIds.forEach((id, index) => {
            const li = document.createElement('li');
            li.setAttribute('data-id', id);
            li.innerHTML = `<span style="opacity:0.5">${index + 1}</span> <strong>Video ${id.substring(0,5)}...</strong>`;
            li.onclick = () => player.playVideoAt(index);
            container.appendChild(li);
        });
    }

    function updatePlaylistSelection() {
        const data = player.getVideoData();
        if(!data) return;
        document.querySelectorAll('#playlist-items li').forEach(li => {
            li.classList.toggle('active', li.getAttribute('data-id') === data.video_id);
        });
    }

    function togglePlayPause() {
        player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
    }

    function handleMusicMode() {
        document.getElementById('player-wrapper').classList.toggle('music-mode-active', document.getElementById('m-toggle').checked);
    }

    function setVp() {
        player.setPlaybackRate(parseFloat(document.getElementById('v-speed').value));
    }

    function showThumb(id) {
        if(!id) return;
        const img = document.getElementById('thumb-img');
        img.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
        img.style.display = 'block';
    }
</script>
</body>
</html>
