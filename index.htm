<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Pro Max</title>
    <style>
        :root { --primary: #ff4444; --bg: #0b0b0b; --card: #161616; --text: #eee; --accent: #1db954; --item-hover: #333; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        .main-layout { display: flex; gap: 20px; width: 100%; max-width: 1200px; flex-wrap: wrap; }
        
        /* Cột bên trái: Player & Tools */
        .left-col { flex: 2; min-width: 350px; }
        .container { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        /* Cột bên phải: Playlist */
        .right-col { flex: 1; min-width: 300px; background: var(--card); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; max-height: 85vh; }
        
        h1 { color: var(--primary); text-align: center; font-size: 20px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .playlist-title { font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; color: var(--accent); }
        
        #playlist-items { overflow-y: auto; flex-grow: 1; list-style: none; padding: 0; margin: 0; }
        #playlist-items li { padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; display: flex; align-items: center; gap: 10px; background: #222; }
        #playlist-items li:hover { background: var(--item-hover); }
        #playlist-items li.active { border-left: 4px solid var(--accent); background: #2a2a2a; color: var(--accent); }

        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; outline: none; }
        button#main-run { padding: 0 20px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        #player-wrapper { 
            width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; 
            overflow: hidden; margin-bottom: 20px; transition: all 0.4s ease;
        }
        .music-mode-active { height: 0px !important; opacity: 0; margin-bottom: 0 !important; }

        .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .panel { background: #222; padding: 15px; border-radius: 12px; }
        .flex-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
        
        .btn-action { background: #333; color: white; border: 1px solid #444; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .btn-action:hover { background: var(--accent); }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        #thumb-img { width: 20%; height: 20%; border-radius: 12px; margin-top: 15px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        select { background: #333; color: white; border: none; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="left-col">
        <div class="container">
            <h1>Music Pro</h1>
            <div class="input-box">
                <input type="text" id="v-url" value="https://www.youtube.com/playlist?list=PL4fGSI1pDJn6jWjXsfV51Gv19FEel73Sj" placeholder="Dán link Video hoặc Playlist vào đây...">
                <button id="main-run" onclick="loadSource()">CHẠY</button>
            </div>

            <div id="player-wrapper"><div id="player"></div></div>

            <div class="tools">
                <div class="panel">
                    <div class="flex-row">
                        <span>Tốc độ:</span>
                        <select id="v-speed" onchange="setVp()">
                            <option value="1">1.0x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2.0x</option>
                            <option value="4">4.0x</option>
                        </select>
                    </div>
                    <div class="flex-row">
                        <span>Điều khiển:</span>
                        <div>
                            <button class="btn-action" onclick="player.previousVideo()">PREV</button>
                            <button id="pp-btn" class="btn-action" onclick="togglePlayPause()">PAUSE</button>
                            <button class="btn-action" onclick="player.nextVideo()">NEXT</button>
                        </div>
                    </div>
                </div>
                <div class="panel">
                    <div class="flex-row">
                        <span>Chỉ nghe nhạc:</span>
                        <label class="switch">
                            <input type="checkbox" id="m-toggle" onchange="handleMusicMode()">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="flex-row">
                        <span>Lặp lại (Loop):</span>
                        <label class="switch">
                            <input type="checkbox" id="l-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
            <img id="thumb-img" alt="Thumbnail">
        </div>
    </div>

    <div class="right-col">
        <div class="playlist-title" id="pl-title">ĐANG PHÁT: VIDEO ĐƠN</div>
        <ul id="playlist-items">
            <li style="color: #666; justify-content: center;">Chưa có danh sách...</li>
        </ul>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    let currentListId = null;

    function onYouTubeIframeAPIReady() {
        loadSource();
    }

    function loadSource() {
        const url = document.getElementById('v-url').value;
        const videoId = url.match(/(?:youtu\.be\/|youtube\.com.*v=)([a-zA-Z0-9_-]{11})/)?.[1];
        const playlistId = url.match(/[&?]list=([a-zA-Z0-9_-]+)/)?.[1];

        if (!videoId && !playlistId) return alert("Link không hợp lệ!");

        if (!player) {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'enablejsapi': 1 },
                events: { 
                    'onStateChange': onPlayerStateChange,
                    'onReady': () => { processLoad(videoId, playlistId); }
                }
            });
        } else {
            processLoad(videoId, playlistId);
        }
    }

    function processLoad(videoId, playlistId) {
        if (playlistId) {
            player.loadPlaylist({ list: playlistId, listType: 'playlist' });
            currentListId = playlistId;
            document.getElementById('pl-title').innerText = "DANH SÁCH PHÁT";
        } else {
            player.loadVideoById(videoId);
            currentListId = null;
            document.getElementById('pl-title').innerText = "VIDEO ĐƠN";
            updatePlaylistUI([]); // Xóa list cũ
        }
        showThumb(videoId);
    }

    function onPlayerStateChange(event) {
        const btn = document.getElementById('pp-btn');
        if (event.data === YT.PlayerState.PLAYING) {
            btn.innerText = "PAUSE";
            // Cập nhật giao diện playlist khi chuyển bài
            updatePlaylistSelection();
            const data = player.getVideoData();
            if(data && data.video_id) showThumb(data.video_id);
        } else if (event.data === YT.PlayerState.PAUSED) {
            btn.innerText = "PLAY";
        }

        if (event.data === YT.PlayerState.ENDED) {
            if (document.getElementById('l-toggle').checked) {
                player.playVideo();
            }
        }

        // Lấy danh sách video nếu là playlist
        if (event.data === YT.PlayerState.CUED || event.data === YT.PlayerState.PLAYING) {
            const list = player.getPlaylist();
            if (list && list.length > 0) updatePlaylistUI(list);
        }
    }

    function updatePlaylistUI(listIds) {
        const container = document.getElementById('playlist-items');
        if (listIds.length === 0) {
            container.innerHTML = '<li style="color: #666; justify-content: center;">Video đơn lẻ</li>';
            return;
        }
        
        container.innerHTML = "";
        listIds.forEach((id, index) => {
            const li = document.createElement('li');
            li.setAttribute('data-id', id);
            li.innerHTML = `<span>${index + 1}.</span> Video ID: ${id}`;
            li.onclick = () => player.playVideoAt(index);
            container.appendChild(li);
        });
    }

    function updatePlaylistSelection() {
        const currentId = player.getVideoData().video_id;
        document.querySelectorAll('#playlist-items li').forEach(li => {
            li.classList.toggle('active', li.getAttribute('data-id') === currentId);
        });
    }

    function togglePlayPause() {
        const state = player.getPlayerState();
        state === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
    }

    function handleMusicMode() {
        const isMusic = document.getElementById('m-toggle').checked;
        document.getElementById('player-wrapper').classList.toggle('music-mode-active', isMusic);
    }

    function setVp() {
        player.setPlaybackRate(parseFloat(document.getElementById('v-speed').value));
    }

    function showThumb(id) {
        if(!id) return;
        const img = document.getElementById('thumb-img');
        img.src = `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
        img.onload = function() {
            if(this.naturalWidth <= 120) this.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
            img.style.display = 'block';
        };
    }
</script>
</body>
</html>
